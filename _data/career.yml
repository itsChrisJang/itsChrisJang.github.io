- company: TONYMOLY
  period: Mar 2024 – Jan 2026
  role: Backend Engineering
  summary: Commerce services, caching, concurrency control, and query optimization.
  details:
    - Built and operated commerce services, including event promotions and internal systems.
    - Developed multi-layer caching and synchronization, reducing average response time from 316.34 ms to 230.79 ms.
    - Applied Redis Lettuce distributed locks to coordinate promotion participation and preserve data consistency.
    - Optimized SQL execution plans and indexes; product-detail page loading performance improved by 72%.
    - Automated review collection workflows with rate limiting and incremental collection.
  company_ko: 토니모리
  role_ko: 백엔드 개발
  summary_ko: 커머스 서비스, 캐싱, 동시성 제어 및 쿼리 최적화.
  details_ko:
    - 프로모션 및 내부 시스템을 포함한 커머스 서비스를 개발하고 운영했습니다.
    - 다중 계층 캐싱과 동기화를 구현하여 평균 응답 시간을 316.34ms에서 230.79ms로 단축했습니다.
    - Redis Lettuce 분산 락을 적용해 프로모션 참여를 제어하고 데이터 정합성을 유지했습니다.
    - SQL 실행 계획과 인덱스를 최적화하여 상품 상세 페이지 로딩 성능을 72% 개선했습니다.
    - 호출량 제한과 증분 수집을 적용해 리뷰 수집을 자동화했습니다.
